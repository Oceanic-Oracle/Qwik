user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log debug;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100M;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log debug;

    upstream warehouse {
        server warehouse:8080;
    }

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Статические файлы
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Прокси для API warehouse
        location /warehouse/ {
            # Просто проксируем на бэкенд
            proxy_pass http://warehouse/;
            
            # Прокси заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Пробрасываем Authorization заголовок
            proxy_set_header Authorization $http_authorization;
            
            # Важно: не добавляем CORS заголовки здесь, 
            # так как бэкенд уже добавляет их
        }
    }
}